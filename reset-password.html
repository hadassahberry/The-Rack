<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - The Rack</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body>
    <div class="auth-screen">
        <div class="auth-card">
            <div class="brand">
                <h1>The Rack</h1>
            </div>
            <p class="auth-subtitle" id="reset-subtitle">Checking your link&hellip;</p>
            <div id="reset-error" class="auth-error hidden"></div>

            <div id="reset-form-section" class="hidden">
                <input type="password" id="new-password" placeholder="New password" autocomplete="new-password">
                <input type="password" id="confirm-password" placeholder="Confirm new password" autocomplete="new-password">
                <button id="reset-submit-btn" class="primary-btn">Set New Password</button>
            </div>

            <div id="reset-success-section" class="hidden">
                <p class="auth-subtitle">You can now sign in with your new password.</p>
                <a href="index.html" class="primary-btn reset-home-link">Go to The Rack</a>
            </div>
        </div>
    </div>

    <script type="module" src="js/firebase-init.js"></script>
    <script src="js/state.js"></script>
    <script src="js/reset-password.js"></script>
</body>
</html>
