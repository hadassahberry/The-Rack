<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Rack - Closet Calendar</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>The Rack</h1>
        <p>Plan your weekly outfits from your digital closet</p>
    </header>

    <main class="app-container">
        <!-- Closet Sidebar -->
        <section class="closet-section">
            <h2>My Closet</h2>
            <div class="upload-box">
                <label for="item-upload" class="upload-btn">+ Add Closet Item</label>
                <input type="file" id="item-upload" accept="image/*" multiple style="display: none;">
            </div>
            <div id="closet-items" class="closet-grid">
                <!-- Uploaded items appear here -->
            </div>
        </section>

        <!-- Weekly Calendar Grid Section -->
        <section class="calendar-section">
            <div class="calendar-header">
                <h2>Weekly Planner</h2>
                <div id="weather-banner" class="weather-banner">🌤️ Loading forecast...</div>
            </div>
            <div id="weekly-grid" class="weekly-grid">
                <!-- 7 Days generated via JS -->
            </div>
        </section>
    </main>

    <script src="image-slot.js"></script>
</body>
</html>
